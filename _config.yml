# Site settings
title: "Faisal Alvi | WordPress & WooCommerce Solutions Architect"
description: "Building high-performing WordPress & WooCommerce solutions | Open-source contributor | 12+ years shaping enterprise-grade digital experiences"
author: "Faisal Alvi"
email: "hello@faisalalvi.com"
url: "https://faisalalvi.com"
baseurl: ""

twitter:
  username: _the_faisal
  card: summary_large_image

# Default social-share image for pages/posts that don't set their
# own `image:` in front matter (see defaults block below).
logo: /assets/imgs/me-amsterdam.jpg

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: UTC

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Faisal Alvi"
      image: "/assets/imgs/me-amsterdam.jpg"
  - scope:
      path: "blog/index.html"
    values:
      image: "/assets/imgs/me-amsterdam.jpg"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
# index-v1.html, index-v2.html, components.html are archived drafts:
# excluded from the build entirely so they are not reachable at any
# URL, not just noindexed. Only index.html (the live homepage) is served.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - index-v1.html
  - index-v2.html
  - components.html
