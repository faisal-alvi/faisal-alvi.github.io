name: Notify on new post

on:
  push:
    branches: [main, 'autoblog-needs-review-*']
    paths: ['_posts/**']
  workflow_dispatch:
    inputs:
      file:
        description: 'Post file to announce (for testing), e.g. _posts/2026-10-02-example.md'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Announce new posts
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FILE: ${{ github.event.inputs.file }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          files=""
          if [ -n "${INPUT_FILE:-}" ]; then
            files="$INPUT_FILE"
          elif [ "$REF" = "refs/heads/main" ]; then
            if [[ ! "$BEFORE" =~ ^0+$ ]]; then
              files=$(git diff --name-only --diff-filter=A "$BEFORE" "$SHA" -- _posts || true)
            fi
          else
            files=$(git diff --name-only --diff-filter=A origin/main "$SHA" -- _posts || true)
          fi

          [ -z "$files" ] && { echo "No new posts in this push."; exit 0; }

          for f in $files; do
            title=$(grep -m1 '^title:' "$f" | sed -E 's/^title: *//; s/^"//; s/"$//')
            slug=$(basename "$f" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
            url="https://faisalalvi.com/blog/$slug/"

            if [ "$REF" = "refs/heads/main" ]; then
              live=no
              for i in $(seq 1 40); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
                if [ "$code" = "200" ]; then live=yes; break; fi
                sleep 30
              done
              if [ "$live" = "yes" ]; then
                gh issue create --repo "$REPO" --assignee "$OWNER" \
                  --title "Post live: $title" \
                  --body "@$OWNER your new post is live and returning 200: $url"
              else
                gh issue create --repo "$REPO" --assignee "$OWNER" \
                  --title "Post pushed but not live after 20 min: $title" \
                  --body "@$OWNER the post was pushed to main but $url did not return 200 within 20 minutes. Check the Pages build in the Actions tab."
              fi
            else
              gh issue create --repo "$REPO" --assignee "$OWNER" \
                --title "Draft needs your review: $title" \
                --body "@$OWNER the routine saved a draft instead of publishing. Branch: https://github.com/$REPO/blob/$BRANCH/$f"
            fi
          done
