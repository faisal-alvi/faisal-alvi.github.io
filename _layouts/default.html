<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- SEO: title, description, canonical, OG, Twitter, JSON-LD (jekyll-seo-tag) -->
    {% seo %}
    {% feed_meta %}

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/assets/imgs/favicon/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/imgs/favicon/apple-touch-icon.png' | relative_url }}">

    <!-- Fonts (match homepage) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
    {% for css in page.extra_css %}<link rel="stylesheet" href="{{ css | relative_url }}">
    {% endfor %}

    <!-- GA4 + consent defaults + CTA events (docs/analytics.md) -->
    <script defer src="{{ '/assets/js/analytics.js' | relative_url }}" data-consent-banner="true"></script>
</head>
<body>

    <!-- ── Nav ── -->
    <nav class="blog-nav">
        <div class="blog-nav-inner">
            <a class="blog-nav-logo" href="{{ '/' | relative_url }}" aria-label="Faisal Alvi">
                <svg viewBox="0 0 232 48" class="blog-logo-mark" role="img" aria-label="Faisal Alvi">
                    <defs>
                        <linearGradient id="fa-bg-blog" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161a2e"/><stop offset="1" stop-color="#2a2c63"/></linearGradient>
                        <radialGradient id="fa-glow-blog" cx="0.7" cy="0.2" r="0.65"><stop offset="0" stop-color="#6366f1" stop-opacity=".55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
                        <linearGradient id="fa-txt-blog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7f7ff"/><stop offset=".45" stop-color="#f7f7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
                    </defs>
                    <rect width="48" height="48" rx="11" fill="url(#fa-bg-blog)"/>
                    <rect width="48" height="48" rx="11" fill="url(#fa-glow-blog)"/>
                    <text x="24" y="31" text-anchor="middle" font-weight="800" letter-spacing="-1.4" font-size="23" fill="url(#fa-txt-blog)">fa</text>
                    <text x="62" y="31" font-weight="700" letter-spacing="2" font-size="17" fill="#0d1117">FAISAL ALVI</text>
                </svg>
            </a>
            <div class="blog-nav-links">
                <a href="{{ '/' | relative_url }}" class="blog-nav-home">Home</a>
                <a href="{{ '/portfolio/' | relative_url }}"{% if page.url == '/portfolio/' %} aria-current="page"{% endif %}>Work</a>
                <a href="{{ '/case-studies/' | relative_url }}">Case Studies</a>
                <a href="{{ '/blog/' | relative_url }}">Blog</a>
                <a href="{{ '/woocommerce-ga4-audit/' | relative_url }}" class="blog-nav-free"{% if page.url == '/woocommerce-ga4-audit/' %} aria-current="page"{% endif %}>Free GA4 Audit</a>
                <a href="https://calendly.com/faisalalvi33/new-meeting" target="_blank" rel="noopener" class="blog-nav-btn">Book a Call</a>
            </div>
        </div>
    </nav>

    {{ content }}

    <!-- ── Footer ── -->
    <footer class="blog-footer">
        <div class="blog-container">
            &copy; {{ 'now' | date: "%Y" }} Faisal Alvi &middot;
            <a href="{{ '/' | relative_url }}">Home</a> &middot;
            <a href="{{ '/portfolio/' | relative_url }}">Work</a> &middot;
            <a href="{{ '/case-studies/' | relative_url }}">Case Studies</a> &middot;
            <a href="{{ '/blog/' | relative_url }}">Blog</a> &middot;
            <a href="{{ '/tools/' | relative_url }}">Tools</a> &middot;
            <a href="https://www.linkedin.com/in/alvifaisal/" target="_blank" rel="noopener">LinkedIn</a> &middot;
            <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        </div>
    </footer>

</body>
</html>
